<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShufflePro</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="loginScreen" class="login-screen">
      <form id="loginForm" class="login-panel">
        <h1>ShufflePro</h1>
        <p>Sign in to manage your courts.</p>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
        <button id="loginSubmit" class="primary" type="submit">Sign in</button>
      </form>
    </main>

    <div id="appShell" class="container hidden">
      <header class="header">
        <h1>ShufflePro</h1>
        <p>Badminton player shuffling made simple</p>
        <button id="logoutBtn" class="secondary" type="button">Sign out</button>
      </header>

      <section class="panel">
        <div class="input-row">
          <input id="playerName" type="text" placeholder="Player name" aria-label="Player name" />
          <select id="playerSkill" aria-label="Skill level">
            <option value="beginner">Beginner</option>
            <option value="intermediate" selected>Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <button id="addPlayerBtn" class="primary">Add player</button>
        </div>

        <div class="controls">
          <label for="matchType">Match type:</label>
          <select id="matchType">
            <option value="doubles">Doubles</option>
            <option value="singles">Singles</option>
          </select>

          <label for="courtCount">Courts:</label>
          <select id="courtCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>

          <button id="shuffleBtn" class="primary">Shuffle courts</button>
          <button id="resetBtn" class="secondary">Clear all</button>
        </div>
      </section>

      <section class="card player-card" id="playersSection">
        <div class="player-header" id="playerToggle" aria-label="Toggle player list">
          <div style="display: flex; align-items: center; gap: 10px;">
            <h2>Players</h2>
            <span id="playerCountBadge" class="badge player-count-badge" style="min-width: 28px; height: 22px; font-size: 0.72rem;">0</span>
          </div>
          <button type="button" class="toggle-btn" aria-expanded="true">−</button>
        </div>

        <div class="player-card-body">
          <ul id="playerList" class="player-list"></ul>
        </div>
      </section>

      <section class="card courts-wrapper">
        <h2>Courts</h2>
        <div id="courtsOutput" class="court-grid">
          <p class="empty">No court assignments yet.</p>
        </div>
      </section>

      <section class="team-card bench-wrapper">
        <div class="bench-header">
          <h2>Bench</h2>
          <button id="benchToggle" type="button" class="toggle-btn" aria-label="Collapse bench" aria-controls="benchCardBody" aria-expanded="true">−</button>
        </div>
        <div id="benchCardBody" class="bench-card-body">
          <ul id="benchList">
            <li class="empty">No players on bench.</li>
          </ul>
        </div>
      </section>
    </div>

    <script type="module" src="./src/login.mjs"></script>
  </body>
</html>
