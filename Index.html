<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShufflePro</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --line: #374151;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --primary: #22c55e;
        --primary-dark: #16a34a;
        --danger: #ef4444;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 24px;
      }

      .header h1 {
        margin: 0;
        font-size: 2.3rem;
      }

      .header p {
        color: var(--muted);
        margin-top: 8px;
      }

      .panel,
      .card {
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .input-row,
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .input-row {
        margin-bottom: 14px;
      }

      .input-row > * {
        flex: 1 1 180px;
      }

      .controls > * {
        flex: 1 1 140px;
      }

      input,
      select,
      button {
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 12px 14px;
        font-size: 1rem;
      }

      input,
      select {
        background: #0b1220;
        color: var(--text);
      }

      button {
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s ease;
      }

      .primary {
        background: var(--primary);
        color: #06250d;
        border-color: var(--primary);
      }

      .primary:hover {
        background: var(--primary-dark);
      }

      .secondary {
        background: transparent;
        color: var(--text);
      }

      .danger {
        background: transparent;
        color: #fecaca;
        border-color: #7f1d1d;
      }

      .danger:hover {
        background: rgba(239, 68, 68, 0.12);
      }

      .danger.icon-button {
        width: 38px;
        height: 38px;
        min-width: 38px;
        min-height: 38px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        font-size: 1.1rem;
        line-height: 1;
      }

      .app-popup,
      .app-confirm {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }

      .app-popup.hidden,
      .app-confirm.hidden {
        display: none;
      }

      .app-popup-backdrop,
      .app-confirm-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(2, 6, 23, 0.7);
      }

      .app-popup-dialog,
      .app-confirm-dialog {
        position: relative;
        width: min(90vw, 360px);
        background: #111827;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
        padding: 22px 20px 18px;
      }

      .app-popup-message,
      .app-confirm-message {
        margin: 0 0 18px;
        color: var(--text);
        line-height: 1.5;
      }

      .app-confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .card h2 {
        margin-top: 0;
        margin-bottom: 12px;
      }

      .player-card {
        margin-top: 24px;
      }

      .player-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }

      .player-header h2 {
        margin: 0;
        flex: 1;
        min-width: 0;
      }

      .toggle-btn {
        width: 36px;
        height: 36px;
        min-width: 36px;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #0b1220;
        color: var(--text);
        font-size: 1.3rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        flex-shrink: 0;
        touch-action: manipulation;
      }

      .player-card.collapsed .player-card-body {
        display: none;
      }

      .player-card-body {
        padding-top: 12px;
      }

      .player-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .player-item {
        background: #0b1220;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .player-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 22px;
        padding: 2px 8px;
        border-radius: 999px;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-weight: 700;
        font-size: 0.65rem;
        letter-spacing: 0.02em;
      }

      .badge.skill-beginner {
        background: #22c55e;
      }

      .badge.skill-intermediate {
        background: #38bdf8;
      }

      .badge.skill-advanced {
        background: #f97316;
      }

      .badge.player-count-badge {
        background: #8b5cf6;
        border-color: rgba(167, 139, 250, 0.6);
      }

      .court-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }

      .court-card,
      .team-card {
        background: #0b1220;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      }

      .court-card.drag-over,
      .team-card.drag-over {
        border-color: var(--accent);
        background: rgba(56, 189, 248, 0.08);
      }

      .court-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        cursor: pointer;
        user-select: none;
      }

      .court-header-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        margin-left: auto;
      }

      .court-header h3,
      .team-card h3 {
        margin-top: 0;
        margin-bottom: 10px;
        flex: 1;
        min-width: 0;
      }

      .court-lock-toggle,
      .court-toggle {
        width: 28px;
        height: 28px;
        min-width: 28px;
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #0b1220;
        color: var(--text);
        font-size: 0.95rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        flex-shrink: 0;
        touch-action: manipulation;
      }

      .court-lock-toggle {
        background: rgba(59, 130, 246, 0.14);
        color: #93c5fd;
        border-color: rgba(96, 165, 250, 0.65);
      }

      .court-lock-toggle[aria-pressed="false"] {
        background: rgba(34, 197, 94, 0.16);
        color: #86efac;
        border-color: rgba(74, 222, 128, 0.8);
      }

      .court-lock-toggle[aria-pressed="true"] {
        background: rgba(239, 68, 68, 0.16);
        color: #fca5a5;
        border-color: rgba(248, 113, 113, 0.85);
      }

      .court-card.locked .court-header h3 {
        color: #fca5a5;
      }

      .court-card.collapsed .court-body {
        display: none;
      }

      .court-body {
        padding-top: 12px;
      }

      .court-card ul,
      .team-card ul {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
      }

      .court-card li,
      #benchList li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .court-player,
      .bench-player {
        cursor: grab;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.75);
        touch-action: none;
      }

      .court-player.dragging,
      .bench-player.dragging {
        opacity: 0.55;
        cursor: grabbing;
      }

      .drag-ghost {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        opacity: 0.9;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--accent);
        border-radius: 10px;
        padding: 8px 10px;
        min-width: 130px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      }

      .empty {
        color: var(--muted);
        opacity: 0.9;
      }

      .courts-wrapper {
        margin-top: 24px;
      }

      @media (max-width: 760px) {
        .container {
          padding: 14px;
        }

        .input-row,
        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        .input-row > *,
        .controls > * {
          width: 100%;
          flex-basis: 100%;
        }

        .panel {
          padding: 14px;
        }

        .player-header,
        .court-header {
          min-height: 36px;
        }

        .court-header {
          row-gap: 6px;
        }

        .toggle-btn,
        .court-toggle,
        .court-lock-toggle {
          width: 32px;
          height: 32px;
          min-width: 32px;
          min-height: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>ShufflePro</h1>
        <p>Badminton player shuffling made simple</p>
      </header>

      <section class="panel">
        <div class="input-row">
          <input id="playerName" type="text" placeholder="Player name" aria-label="Player name" />
          <select id="playerSkill" aria-label="Skill level">
            <option value="beginner">Beginner</option>
            <option value="intermediate" selected>Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <button id="addPlayerBtn" class="primary">Add player</button>
        </div>

        <div class="controls">
          <label for="matchType">Match type:</label>
          <select id="matchType">
            <option value="doubles">Doubles</option>
            <option value="singles">Singles</option>
          </select>

          <label for="courtCount">Courts:</label>
          <select id="courtCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>

          <button id="shuffleBtn" class="primary">Shuffle courts</button>
          <button id="resetBtn" class="secondary">Clear all</button>
        </div>
      </section>

      <section class="card player-card" id="playersSection">
        <div class="player-header" id="playerToggle" aria-label="Toggle player list">
          <div style="display: flex; align-items: center; gap: 10px;">
            <h2>Players</h2>
            <span id="playerCountBadge" class="badge player-count-badge" style="min-width: 28px; height: 22px; font-size: 0.72rem;">0</span>
          </div>
          <button type="button" class="toggle-btn" aria-expanded="true">−</button>
        </div>

        <div class="player-card-body">
          <ul id="playerList" class="player-list"></ul>
        </div>
      </section>

      <section class="card courts-wrapper">
        <h2>Courts</h2>
        <div id="courtsOutput" class="court-grid">
          <p class="empty">No court assignments yet.</p>
        </div>

        <div class="team-card" style="margin-top: 18px;">
          <h3>Bench</h3>
          <ul id="benchList">
            <li class="empty">No players on bench.</li>
          </ul>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = "shuffleProPlayers";
      const ASSIGNMENT_KEY = "shuffleProAssignments";
      const LOCKED_COURTS_KEY = "shuffleProLockedCourts";

      const skillRankMap = {
        beginner: 1,
        intermediate: 2,
        advanced: 3
      };

      function makePlayerId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }

        return `player-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function getSkillRank(skill) {
        const value = String(skill || "beginner").toLowerCase();
        return skillRankMap[value] ?? 1;
      }

      function getSkillLabel(skill) {
        const value = String(skill || "beginner").toLowerCase();
        if (value === "beginner") return "Beginner";
        if (value === "intermediate") return "Intermediate";
        return "Advanced";
      }

      function normalizePlayer(player) {
        return {
          ...player,
          id: player.id || makePlayerId(),
          skill: String(player.skill || "beginner").toLowerCase(),
          skillRank: getSkillRank(player.skill)
        };
      }

      const playerNameInput = document.getElementById("playerName");
      const playerSkillSelect = document.getElementById("playerSkill");
      const addPlayerBtn = document.getElementById("addPlayerBtn");
      const shuffleBtn = document.getElementById("shuffleBtn");
      const resetBtn = document.getElementById("resetBtn");
      const playerList = document.getElementById("playerList");
      const courtsOutput = document.getElementById("courtsOutput");
      const matchType = document.getElementById("matchType");
      const courtCountSelect = document.getElementById("courtCount");
      const benchList = document.getElementById("benchList");

      let players = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").map(normalizePlayer);
      let currentAssignments = { courts: [], bench: [] };
      const collapsedCourtState = new Set();
      let lockedCourts = new Set(JSON.parse(localStorage.getItem(LOCKED_COURTS_KEY) || "[]"));
      let draggedPlayer = null;
      let dragGhost = null;
      let dragScrollTimer = null;
      let lastPointerEvent = null;

      function showPopup(message) {
        let popup = document.getElementById("appPopup");
        if (!popup) {
          popup = document.createElement("div");
          popup.id = "appPopup";
          popup.className = "app-popup hidden";
          popup.innerHTML = `
            <div class="app-popup-backdrop"></div>
            <div class="app-popup-dialog" role="alertdialog" aria-modal="true" aria-live="assertive">
              <p class="app-popup-message"></p>
              <button type="button" class="primary app-popup-close">OK</button>
            </div>
          `;
          document.body.appendChild(popup);

          popup.querySelector(".app-popup-close").addEventListener("click", () => {
            popup.classList.add("hidden");
          });

          popup.querySelector(".app-popup-backdrop").addEventListener("click", () => {
            popup.classList.add("hidden");
          });
        }

        popup.querySelector(".app-popup-message").textContent = message;
        popup.classList.remove("hidden");
      }

      function showConfirm(message, onConfirm) {
        let confirmBox = document.getElementById("appConfirm");
        if (!confirmBox) {
          confirmBox = document.createElement("div");
          confirmBox.id = "appConfirm";
          confirmBox.className = "app-confirm hidden";
          confirmBox.innerHTML = `
            <div class="app-confirm-backdrop"></div>
            <div class="app-confirm-dialog" role="dialog" aria-modal="true">
              <p class="app-confirm-message"></p>
              <div class="app-confirm-actions">
                <button type="button" class="secondary app-confirm-cancel">Cancel</button>
                <button type="button" class="primary app-confirm-ok">OK</button>
              </div>
            </div>
          `;
          document.body.appendChild(confirmBox);

          confirmBox.querySelector(".app-confirm-backdrop").addEventListener("click", () => {
            confirmBox.classList.add("hidden");
          });
          confirmBox.querySelector(".app-confirm-cancel").addEventListener("click", () => {
            confirmBox.classList.add("hidden");
          });
        }

        const confirmMessage = confirmBox.querySelector(".app-confirm-message");
        const confirmOk = confirmBox.querySelector(".app-confirm-ok");
        confirmMessage.textContent = message;
        confirmOk.onclick = () => {
          confirmBox.classList.add("hidden");
          onConfirm();
        };
        confirmBox.classList.remove("hidden");
      }

      function savePlayers() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
      }

      function saveAssignments() {
        localStorage.setItem(ASSIGNMENT_KEY, JSON.stringify(currentAssignments));
      }

      function saveLockedCourts() {
        localStorage.setItem(LOCKED_COURTS_KEY, JSON.stringify(Array.from(lockedCourts).sort((a, b) => a - b)));
      }

      function getCourtCapacity() {
        return matchType.value === "singles" ? 2 : 4;
      }

      function createPlayerMeta(player) {
        const meta = document.createElement("div");
        meta.className = "player-meta";

        const label = document.createElement("span");
        label.textContent = player.name;

        const badge = document.createElement("span");
        badge.className = `badge skill-${String(player.skill || "beginner").toLowerCase()}`;
        badge.textContent = getSkillLabel(player.skill);

        meta.appendChild(label);
        meta.appendChild(badge);

        return meta;
      }

      function renderPlayers() {
        const playerCountBadge = document.getElementById("playerCountBadge");
        if (playerCountBadge) {
          playerCountBadge.textContent = String(players.length);
        }

        playerList.innerHTML = "";

        if (players.length === 0) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "No players added yet.";
          playerList.appendChild(li);
          return;
        }

        players.forEach((player, index) => {
          const item = document.createElement("li");
          item.className = "player-item";
          const meta = createPlayerMeta(player);

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "danger icon-button";
          deleteBtn.type = "button";
          deleteBtn.setAttribute("aria-label", `Remove ${player.name}`);
          deleteBtn.title = `Remove ${player.name}`;
          deleteBtn.textContent = "🗑";
          deleteBtn.addEventListener("click", () => {
            players.splice(index, 1);
            savePlayers();
            refreshAssignmentsFromPlayers();
            renderPlayers();
            renderCourts();
          });

          item.appendChild(meta);
          item.appendChild(deleteBtn);
          playerList.appendChild(item);
        });
      }

      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function mixPlayersBySkill(selectedPlayers) {
        const groups = {
          beginner: [],
          intermediate: [],
          advanced: []
        };

        selectedPlayers.forEach((player) => {
          const key = String(player.skill || "beginner").toLowerCase();
          if (!groups[key]) groups[key] = [];
          groups[key].push(player);
        });

        const mixed = [];

        Object.keys(groups).forEach((key) => {
          const shuffledGroup = shuffleArray(groups[key]);
          shuffledGroup.forEach((player) => mixed.push(player));
        });

        return shuffleArray(mixed);
      }

      function generateCourts(selectedPlayers, mode, courtTotal) {
        if (selectedPlayers.length === 0) {
          return {
            courts: Array.from({ length: courtTotal }, () => []),
            bench: []
          };
        }

        const playersPerCourt = mode === "singles" ? 2 : 4;
        const maxCourtPlayers = courtTotal * playersPerCourt;

        const mixed = mixPlayersBySkill(selectedPlayers);
        const activePlayers = mixed.slice(0, Math.min(mixed.length, maxCourtPlayers));
        const bench = mixed.slice(Math.min(mixed.length, maxCourtPlayers));

        const courts = Array.from({ length: courtTotal }, () => []);

        activePlayers.forEach((player, index) => {
          const courtIndex =
            mode === "singles"
              ? Math.floor(index / playersPerCourt) % courtTotal
              : Math.floor(index / playersPerCourt) % courtTotal;

          courts[courtIndex].push(player);
        });

        return { courts, bench };
      }

      function refreshAssignmentsFromPlayers() {
        const mode = matchType.value;
        const courtTotal = Number(courtCountSelect.value);
        const lockedSet = new Set(lockedCourts);

        if (players.length === 0) {
          currentAssignments = { courts: Array.from({ length: courtTotal }, () => []), bench: [] };
          saveAssignments();
          return;
        }

        const lockedPlayers = new Set();
        const nextCourts = Array.from({ length: courtTotal }, () => []);

        for (let index = 0; index < courtTotal; index++) {
          const courtPlayers = Array.isArray(currentAssignments.courts[index]) ? currentAssignments.courts[index] : [];
          if (lockedSet.has(index)) {
            nextCourts[index] = courtPlayers.filter((player) => players.some((p) => p.id === player.id));
            nextCourts[index].forEach((player) => lockedPlayers.add(player.id));
          }
        }

        const nonLockedPlayers = players.filter((player) => !lockedPlayers.has(player.id));
        const unlockedCourtCount = Math.max(courtTotal - lockedSet.size, 0);

        if (unlockedCourtCount === 0) {
          currentAssignments = { courts: nextCourts, bench: [] };
          saveAssignments();
          return;
        }

        const generated = generateCourts(nonLockedPlayers, mode, unlockedCourtCount);
        const unlockedIndexes = [];

        for (let index = 0; index < courtTotal; index++) {
          if (!lockedSet.has(index)) unlockedIndexes.push(index);
        }

        generated.courts.forEach((courtPlayers, index) => {
          const targetIndex = unlockedIndexes[index];
          if (typeof targetIndex === "number") {
            nextCourts[targetIndex] = courtPlayers;
          }
        });

        currentAssignments = {
          courts: nextCourts,
          bench: generated.bench
        };
        saveAssignments();
      }

      function clearDragState() {
        if (dragGhost) {
          dragGhost.remove();
          dragGhost = null;
        }

        if (dragScrollTimer) {
          clearInterval(dragScrollTimer);
          dragScrollTimer = null;
        }

        document.removeEventListener("pointermove", moveDragGhost);
        document.removeEventListener("pointerup", handlePointerDrop);

        if (draggedPlayer && draggedPlayer.element && draggedPlayer.element.hasPointerCapture) {
          try {
            draggedPlayer.element.releasePointerCapture(draggedPlayer.pointerId);
          } catch (error) {
            // ignore if there is no active capture
          }
        }

        document.querySelectorAll(".court-card, #benchList").forEach((element) => {
          element.classList.remove("drag-over");
        });

        if (draggedPlayer && draggedPlayer.element) {
          draggedPlayer.element.classList.remove("dragging");
        }

        draggedPlayer = null;
        lastPointerEvent = null;
      }

      function startAutoScrollLoop() {
        if (dragScrollTimer) return;

        dragScrollTimer = setInterval(() => {
          if (!draggedPlayer || !lastPointerEvent) return;

          const scrollThreshold = 80;
          const viewportHeight = window.innerHeight;
          const { clientY } = lastPointerEvent;

          if (clientY < scrollThreshold) {
            window.scrollBy({ top: -18, behavior: "auto" });
          } else if (clientY > viewportHeight - scrollThreshold) {
            window.scrollBy({ top: 18, behavior: "auto" });
          }
        }, 16);
      }

      function moveDragGhost(event) {
        if (!dragGhost) return;

        event.preventDefault();
        lastPointerEvent = event;
        dragGhost.style.left = `${event.clientX}px`;
        dragGhost.style.top = `${event.clientY}px`;

        const target = document.elementFromPoint(event.clientX, event.clientY);
        const courtCard = target ? target.closest(".court-card") : null;
        const benchCard = target ? target.closest("#benchList") : null;

        document.querySelectorAll(".court-card, #benchList").forEach((element) => {
          element.classList.toggle("drag-over", element === courtCard || element === benchCard);
        });
      }

      function handlePointerDrop(event) {
        if (!draggedPlayer) return;

        event.preventDefault();
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const courtCard = target ? target.closest(".court-card") : null;
        const benchListTarget = target ? target.closest("#benchList") : null;

        if (courtCard) {
          const courtIndex = Number(courtCard.dataset.courtIndex);
          if (lockedCourts.has(courtIndex)) {
            clearDragState();
            return;
          }
          movePlayerToCourt(courtIndex);
        } else if (benchListTarget) {
          movePlayerToBench();
        }

        clearDragState();
      }

      function startPointerDrag(event, player, options, item) {
        if (event.pointerType === "mouse" && event.button !== 0) {
          return;
        }

        if (event.pointerType === "mouse" && !window.matchMedia("(pointer: coarse)").matches) {
          return;
        }

        if (options.type === "court" && typeof options.courtIndex === "number" && lockedCourts.has(options.courtIndex)) {
          event.preventDefault();
          return;
        }

        event.preventDefault();
        item.setPointerCapture?.(event.pointerId);

        draggedPlayer = {
          player,
          sourceCourtIndex: options.courtIndex ?? null,
          sourceBenchIndex: options.type === "bench" ? options.benchIndex ?? null : null,
          element: item,
          pointerId: event.pointerId
        };

        item.classList.add("dragging");

        dragGhost = document.createElement("div");
        dragGhost.className = "drag-ghost";
        dragGhost.textContent = player.name;
        document.body.appendChild(dragGhost);
        lastPointerEvent = event;
        moveDragGhost(event);
        startAutoScrollLoop();

        document.addEventListener("pointermove", moveDragGhost);
        document.addEventListener("pointerup", handlePointerDrop, { once: true });
      }

      function createDraggablePlayerItem(player, options = {}) {
        const item = document.createElement("li");
        item.className = options.type === "bench" ? "bench-player" : "court-player";
        item.draggable = !(options.type === "court" && typeof options.courtIndex === "number" && lockedCourts.has(options.courtIndex));
        item.dataset.playerId = player.id;
        item.appendChild(createPlayerMeta(player));

        item.addEventListener("dragstart", (event) => {
          if (options.type === "court" && typeof options.courtIndex === "number" && lockedCourts.has(options.courtIndex)) {
            event.preventDefault();
            return;
          }

          draggedPlayer = {
            player,
            sourceCourtIndex: options.courtIndex ?? null,
            sourceBenchIndex: options.type === "bench" ? options.benchIndex ?? null : null,
            element: item
          };
          item.classList.add("dragging");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", player.id);
          }
        });

        item.addEventListener("dragend", () => {
          item.classList.remove("dragging");
          if (!dragGhost) {
            draggedPlayer = null;
          }
        });

        item.addEventListener("pointerdown", (event) => {
          startPointerDrag(event, player, options, item);
        });

        return item;
      }

      function movePlayerToCourt(targetCourtIndex) {
        if (!draggedPlayer) return;

        if (lockedCourts.has(targetCourtIndex)) {
          return;
        }

        const { player, sourceCourtIndex, sourceBenchIndex } = draggedPlayer;
        const targetCourt = currentAssignments.courts[targetCourtIndex];
        const playerAlreadyInTarget = targetCourt.some((courtPlayer) => courtPlayer.id === player.id);

        if (sourceCourtIndex === targetCourtIndex || playerAlreadyInTarget) {
          return;
        }

        if (targetCourt.length >= getCourtCapacity()) {
          showPopup("This court is full.");
          return;
        }

        if (sourceCourtIndex !== null) {
          const sourceCourt = currentAssignments.courts[sourceCourtIndex];
          const sourceIndex = sourceCourt.findIndex((courtPlayer) => courtPlayer.id === player.id);
          if (sourceIndex >= 0) {
            sourceCourt.splice(sourceIndex, 1);
          }
        }

        if (sourceBenchIndex !== null) {
          const sourceIndex = currentAssignments.bench.findIndex((benchPlayer) => benchPlayer.id === player.id);
          if (sourceIndex >= 0) {
            currentAssignments.bench.splice(sourceIndex, 1);
          }
        }

        targetCourt.push(player);
        saveAssignments();
        renderCourts();
      }

      function movePlayerToBench() {
        if (!draggedPlayer) return;

        const { player, sourceCourtIndex, sourceBenchIndex } = draggedPlayer;

        if (sourceBenchIndex !== null) {
          return;
        }

        if (sourceCourtIndex !== null) {
          const sourceCourt = currentAssignments.courts[sourceCourtIndex];
          const sourceIndex = sourceCourt.findIndex((courtPlayer) => courtPlayer.id === player.id);
          if (sourceIndex >= 0) {
            sourceCourt.splice(sourceIndex, 1);
          }
        }

        const existingBenchIndex = currentAssignments.bench.findIndex((benchPlayer) => benchPlayer.id === player.id);
        if (existingBenchIndex >= 0) {
          currentAssignments.bench.splice(existingBenchIndex, 1);
        }

        currentAssignments.bench.push(player);
        saveAssignments();
        renderCourts();
      }

      function bindDropZone(element, onDrop) {
        element.addEventListener("dragover", (event) => {
          if (element.classList.contains("court-card") && lockedCourts.has(Number(element.dataset.courtIndex))) {
            event.preventDefault();
            element.classList.remove("drag-over");
            return;
          }
          event.preventDefault();
          element.classList.add("drag-over");
        });

        element.addEventListener("dragleave", () => {
          element.classList.remove("drag-over");
        });

        element.addEventListener("drop", (event) => {
          event.preventDefault();
          element.classList.remove("drag-over");
          if (element.classList.contains("court-card") && lockedCourts.has(Number(element.dataset.courtIndex))) {
            return;
          }
          onDrop();
        });
      }

      function renderCourts() {
        const mode = matchType.value;
        const courtTotal = Number(courtCountSelect.value);

        let courts = currentAssignments.courts;
        let bench = currentAssignments.bench;

        if (players.length === 0) {
          courtsOutput.innerHTML = '<p class="empty">No court assignments yet.</p>';
          benchList.innerHTML = '<li class="empty">No players on bench.</li>';
          collapsedCourtState.clear();
          lockedCourts.clear();
          saveLockedCourts();
          return;
        }

        if (!Array.isArray(currentAssignments.courts) || currentAssignments.courts.length !== courtTotal) {
          const generated = generateCourts(players, mode, courtTotal);
          courts = generated.courts;
          bench = generated.bench;
        }

        currentAssignments = { courts, bench };
        saveAssignments();

        Array.from(collapsedCourtState).forEach((courtIndex) => {
          if (courtIndex < 0 || courtIndex >= courtTotal) {
            collapsedCourtState.delete(courtIndex);
          }
        });

        Array.from(lockedCourts).forEach((courtIndex) => {
          if (courtIndex < 0 || courtIndex >= courtTotal) {
            lockedCourts.delete(courtIndex);
          }
        });
        saveLockedCourts();

        courtsOutput.innerHTML = "";
        const grid = document.createElement("div");
        grid.className = "court-grid";

        courts.forEach((court, index) => {
          const card = document.createElement("div");
          card.className = "court-card";
          if (collapsedCourtState.has(index)) {
            card.classList.add("collapsed");
          }
          if (lockedCourts.has(index)) {
            card.classList.add("locked");
          }
          card.dataset.courtIndex = String(index);
          bindDropZone(card, () => movePlayerToCourt(index));

          const header = document.createElement("div");
          header.className = "court-header";

          const title = document.createElement("h3");
          title.textContent = `Court ${index + 1}`;

          const controls = document.createElement("div");
          controls.className = "court-header-controls";

          const lockToggle = document.createElement("button");
          lockToggle.type = "button";
          lockToggle.className = "court-lock-toggle";
          const isCourtLocked = lockedCourts.has(index);
          lockToggle.textContent = isCourtLocked ? "🔒" : "🔓";
          lockToggle.setAttribute("aria-label", isCourtLocked ? "Unlock court from shuffling" : "Lock court from shuffling");
          lockToggle.setAttribute("aria-pressed", String(isCourtLocked));
          lockToggle.style.backgroundColor = isCourtLocked ? "rgba(239, 68, 68, 0.18)" : "rgba(34, 197, 94, 0.18)";
          lockToggle.style.color = isCourtLocked ? "#fca5a5" : "#86efac";
          lockToggle.style.borderColor = isCourtLocked ? "rgba(248, 113, 113, 0.9)" : "rgba(74, 222, 128, 0.9)";
          lockToggle.addEventListener("click", (event) => {
            event.stopPropagation();
            if (lockedCourts.has(index)) {
              lockedCourts.delete(index);
            } else {
              lockedCourts.add(index);
            }
            saveLockedCourts();
            renderCourts();
          });

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "court-toggle";
          toggle.textContent = collapsedCourtState.has(index) ? "+" : "−";
          toggle.setAttribute("aria-expanded", String(!collapsedCourtState.has(index)));
          toggle.addEventListener("click", (event) => {
            event.stopPropagation();
            const isCollapsed = card.classList.toggle("collapsed");
            if (isCollapsed) {
              collapsedCourtState.add(index);
            } else {
              collapsedCourtState.delete(index);
            }
            toggle.textContent = isCollapsed ? "+" : "−";
            toggle.setAttribute("aria-expanded", String(!isCollapsed));
          });

          controls.appendChild(lockToggle);
          controls.appendChild(toggle);
          header.appendChild(title);
          header.appendChild(controls);
          card.appendChild(header);

          const body = document.createElement("div");
          body.className = "court-body";

          const list = document.createElement("ul");

          if (court.length === 0) {
            const li = document.createElement("li");
            li.textContent = "No players";
            list.appendChild(li);
          } else {
            court.forEach((player) => {
              const li = createDraggablePlayerItem(player, { type: "court", courtIndex: index });
              list.appendChild(li);
            });
          }

          body.appendChild(list);
          card.appendChild(body);
          grid.appendChild(card);
        });

        courtsOutput.appendChild(grid);

        benchList.innerHTML = "";
        bindDropZone(benchList, movePlayerToBench);
        benchList.dataset.benchList = "true";

        if (bench.length === 0) {
          benchList.innerHTML = "<li class=\"empty\">All players assigned to courts.</li>";
          return;
        }

        bench.forEach((player, index) => {
          const li = createDraggablePlayerItem(player, { type: "bench", benchIndex: index });
          benchList.appendChild(li);
        });
      }

      function addPlayer() {
        const name = playerNameInput.value.trim();
        const skill = playerSkillSelect.value;

        if (!name) {
          showPopup("Please enter a player name.");
          playerNameInput.focus();
          return;
        }

        const isDuplicate = players.some((player) => player.name.trim().toLowerCase() === name.toLowerCase());
        if (isDuplicate) {
          showPopup("Player name must be unique.");
          playerNameInput.focus();
          return;
        }

        players.push({
          id: makePlayerId(),
          name,
          skill: String(skill).toLowerCase()
        });

        savePlayers();
        refreshAssignmentsFromPlayers();
        renderPlayers();
        renderCourts();

        playerNameInput.value = "";
        playerNameInput.focus();
      }

      function clearAll() {
        if (players.length === 0) return;

        showConfirm("Remove all players and reset the courts?", () => {
          players = [];
          localStorage.removeItem(ASSIGNMENT_KEY);
          savePlayers();
          renderPlayers();
          renderCourts();
        });
      }

      const playersSection = document.getElementById("playersSection");
      const playerToggle = document.getElementById("playerToggle");
      const toggleBtn = document.querySelector(".toggle-btn");

      function togglePlayersSection() {
        const isCollapsed = playersSection.classList.toggle("collapsed");
        toggleBtn.textContent = isCollapsed ? "+" : "−";
        toggleBtn.setAttribute("aria-expanded", String(!isCollapsed));
      }

      addPlayerBtn.addEventListener("click", addPlayer);

      playerNameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          addPlayer();
        }
      });

      shuffleBtn.addEventListener("click", () => {
        if (players.length < 2) {
          showPopup("Add at least 2 players to shuffle courts.");
          return;
        }

        const courtTotal = Number(courtCountSelect.value);
        if (lockedCourts.size >= courtTotal) {
          showPopup("Unlock at least one court before shuffling.");
          return;
        }

        const mode = matchType.value;
        const remainingPlayers = players.filter((player) => {
          return !Array.from(lockedCourts).some((courtIndex) => {
            const court = currentAssignments.courts[courtIndex] || [];
            return court.some((courtPlayer) => courtPlayer.id === player.id);
          });
        });

        if (remainingPlayers.length === 0) {
          showPopup("All players are on locked courts.");
          return;
        }

        const unlockedCourtCount = Math.max(courtTotal - lockedCourts.size, 0);
        const generated = generateCourts(remainingPlayers, mode, unlockedCourtCount);
        const nextCourts = Array.from({ length: courtTotal }, () => []);
        const unlockedIndexes = [];

        for (let index = 0; index < courtTotal; index++) {
          if (!lockedCourts.has(index)) {
            unlockedIndexes.push(index);
          }
        }

        Array.from(lockedCourts).forEach((courtIndex) => {
          nextCourts[courtIndex] = [...(currentAssignments.courts[courtIndex] || [])];
        });

        generated.courts.forEach((courtPlayers, index) => {
          const targetIndex = unlockedIndexes[index];
          if (typeof targetIndex === "number") {
            nextCourts[targetIndex] = courtPlayers;
          }
        });

        currentAssignments = {
          courts: nextCourts,
          bench: generated.bench
        };
        saveAssignments();
        renderCourts();
      });

      resetBtn.addEventListener("click", clearAll);
      matchType.addEventListener("change", () => {
        refreshAssignmentsFromPlayers();
        renderCourts();
      });
      courtCountSelect.addEventListener("change", () => {
        refreshAssignmentsFromPlayers();
        renderCourts();
      });
      playerToggle.addEventListener("click", togglePlayersSection);

      const savedAssignments = JSON.parse(localStorage.getItem(ASSIGNMENT_KEY) || "null");
      if (savedAssignments && Array.isArray(savedAssignments.courts) && Array.isArray(savedAssignments.bench)) {
        currentAssignments = {
          courts: savedAssignments.courts.map((court) => Array.isArray(court) ? court.map(normalizePlayer) : []),
          bench: Array.isArray(savedAssignments.bench) ? savedAssignments.bench.map(normalizePlayer) : []
        };
      } else {
        refreshAssignmentsFromPlayers();
      }

      renderPlayers();
      renderCourts();
    </script>
  </body>
</html>
